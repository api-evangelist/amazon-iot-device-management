aid: amazon-iot-device-management
name: Amazon IoT Device Management
description: AWS IoT Device Management makes it easy to securely onboard, organize,
  monitor, and remotely manage your IoT devices at scale. You can register your connected
  devices individually or in bulk, and easily manage permissions so your devices remain
  secure throughout their lifecycle.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
