- type: Features
  data:
  - name: Bulk Device Registration
    description: Register thousands of devices simultaneously using bulk registration
      templates.
  - name: Fleet Indexing
    description: Search and query your entire device fleet based on attributes and
      shadow state.
  - name: Remote Jobs
    description: Deploy firmware updates, configuration changes, and software remotely
      at scale.
  - name: Thing Groups
    description: Organize devices into hierarchical groups for policies and bulk operations.
  - name: Tunnel Secure
    description: Create secure bidirectional tunnels to devices behind firewalls for
      remote troubleshooting.
- type: UseCases
  data:
  - name: OTA Firmware Updates
    description: Deploy firmware updates to thousands of devices simultaneously with
      rollback.
  - name: Device Onboarding
    description: Automate device provisioning and certificate management at manufacturing.
  - name: Fleet Monitoring
    description: Monitor device connectivity, metadata, and shadow state across the
      entire fleet.
- type: Integrations
  data:
  - name: AWS IoT Core
    description: All device management operations integrate with IoT Core connectivity.
  - name: AWS Lambda
    description: Trigger automation workflows based on job status changes.
  - name: Amazon S3
    description: Store firmware and configuration files for remote deployment.
- type: Integrations
  url: https://aws.amazon.com/marketplace
