}

type ExponentialRolloutRate {
  baseRatePerMinute: Int!
  incrementFactor: Float!
  rateIncreaseCriteria: RateIncreaseCriteria!
}

type RateIncreaseCriteria {
  numberOfNotifiedThings: Int
  numberOfSucceededThings: Int
}

input RolloutConfigInput {
  maximumPerMinute: Int
  exponentialRate: ExponentialRolloutRateInput
}

input ExponentialRolloutRateInput {
  baseRatePerMinute: Int!
  incrementFactor: Float!
  rateIncreaseCriteria: RateIncreaseCriteriaInput!
}

input RateIncreaseCriteriaInput {
  numberOfNotifiedThings: Int
  numberOfSucceededThings: Int
}

type RetryConfig {
  criteriaList: [RetryCriteria]
}

type RetryCriteria {
  failureType: RetryableFailureType!
  numberOfRetries: Int!
}

input RetryConfigInput {
  criteriaList: [RetryCriteriaInput!]!
}

input RetryCriteriaInput {
  failureType: RetryableFailureType!
  numberOfRetries: Int!
}

enum RetryableFailureType {
  FAILED
  TIMED_OUT
  ALL
}

type TimeoutConfig {
  inProgressTimeoutInMinutes: InProgressTimeoutInMinutes
}

type InProgressTimeoutInMinutes {
  inProgressTimeoutInMinutes: Int
}

input TimeoutConfigInput {
  inProgressTimeoutInMinutes: Int
}

type AbortConfig {
  criteriaList: [AbortCriteria]
}

type AbortCriteria {
  failureType: JobExecutionFailureType!
  action: AbortAction!
  thresholdPercentage: Float!
  minNumberOfExecutedThings: Int!
}

input AbortConfigInput {
  criteriaList: [AbortCriteriaInput!]!
}

input AbortCriteriaInput {
  failureType: JobExecutionFailureType!
  action: AbortAction!
  thresholdPercentage: Float!
  minNumberOfExecutedThings: Int!
}

enum JobExecutionFailureType {
  FAILED
  REJECTED
  TIMED_OUT
  ALL
}

enum AbortAction {
  CANCEL
}

