"""
AWS IoT Device Management GraphQL Schema
Covers fleet management, thing groups, jobs, fleet indexing, certificates, and policies.
Source: https://docs.aws.amazon.com/iot/latest/apireference/
"""

schema {
  query: Query
  mutation: Mutation
}

type Query {
  # Things
  thing(thingName: String!): ThingDetails
  listThings(attributeName: String, attributeValue: String, thingTypeName: String, maxResults: Int, nextToken: String): ThingList
  thingType(thingTypeName: String!): ThingTypeDetails
  listThingTypes(maxResults: Int, nextToken: String, thingTypeName: String): ThingTypeList

  # Thing Groups
  thingGroup(thingGroupName: String!): ThingGroupDetails
  listThingGroups(parentGroup: String, namePrefixFilter: String, recursive: Boolean, maxResults: Int, nextToken: String): ThingGroupList
  listThingsInThingGroup(thingGroupName: String!, recursive: Boolean, maxResults: Int, nextToken: String): ThingList
  listGroupsForThing(thingName: String!, maxResults: Int, nextToken: String): ThingGroupList

  # Billing Groups
  billingGroup(billingGroupName: String!): BillingGroupDetails
  listBillingGroups(maxResults: Int, nextToken: String, namePrefixFilter: String): BillingGroupList
  listThingsInBillingGroup(billingGroupName: String!, maxResults: Int, nextToken: String): ThingList

  # Jobs
  job(jobId: String!): JobDetails
  listJobs(status: JobStatus, targetSelection: TargetSelection, maxResults: Int, nextToken: String, thingGroupName: String, thingGroupId: String, namespaceId: String): JobList
  jobExecution(jobId: String!, thingName: String!, executionNumber: Int): ExecutionDetails
  listJobExecutionsForJob(jobId: String!, status: JobExecutionStatus, maxResults: Int, nextToken: String): JobExecutionList
  listJobExecutionsForThing(thingName: String!, status: JobExecutionStatus, maxResults: Int, nextToken: String, namespaceId: String): JobExecutionList
  jobDocument(jobId: String!): JobDocument

  # Fleet Indexing
  indexingConfiguration: FleetIndexingConfiguration
  thingIndex(indexName: String!): FleetIndex
  listIndices(maxResults: Int, nextToken: String): FleetIndexList
  searchIndex(input: SearchQueryInput!): SearchResults

  # Fleet Metrics
  fleetMetric(metricName: String!): FleetMetricDetails
  listFleetMetrics(maxResults: Int, nextToken: String): FleetMetricList

  # Certificates
  certificate(certificateId: String!): CertificateDetails
  listCertificates(pageSize: Int, ascendingOrder: Boolean, marker: String): CertificateList
  listCertificatesByCA(caCertificateId: String!, pageSize: Int, ascendingOrder: Boolean, marker: String): CertificateList

  # Policies
  policy(policyName: String!): PolicyDetails
  listPolicies(marker: String, pageSize: Int, ascendingOrder: Boolean): PolicyList
  listPolicyVersions(policyName: String!): PolicyVersionList
  listPrincipalPolicies(principal: String!, marker: String, pageSize: Int, ascendingOrder: Boolean): PolicyList
  listAttachedPolicies(target: String!, recursive: Boolean, marker: String, pageSize: Int): PolicyList
}

type Mutation {
  # Things
  createThing(input: CreateThingInput!): Thing
  updateThing(input: UpdateThingInput!): Thing
  deleteThing(thingName: String!, expectedVersion: Int): Boolean
  createThingType(input: CreateThingTypeInput!): ThingType
  deprecateThingType(thingTypeName: String!, undoDeprecate: Boolean): Boolean
  deleteThingType(thingTypeName: String!): Boolean
  addThingToThingGroup(thingGroupName: String, thingGroupArn: String, thingName: String, thingArn: String, overrideDynamicGroups: Boolean): Boolean
  removeThingFromThingGroup(thingGroupName: String, thingGroupArn: String, thingName: String, thingArn: String): Boolean

  # Thing Groups
  createThingGroup(input: CreateThingGroupInput!): ThingGroup
  updateThingGroup(input: UpdateThingGroupInput!): ThingGroup
  deleteThingGroup(thingGroupName: String!, expectedVersion: Int): Boolean
  addThingToGroup(thingGroupName: String!, thingName: String!): Boolean
  removeThingFromGroup(thingGroupName: String!, thingName: String!): Boolean

  # Dynamic Thing Groups
  createDynamicThingGroup(input: CreateDynamicThingGroupInput!): DynamicThingGroup
  updateDynamicThingGroup(input: UpdateDynamicThingGroupInput!): DynamicThingGroup
  deleteDynamicThingGroup(thingGroupName: String!, expectedVersion: Int): Boolean

  # Billing Groups
  createBillingGroup(input: CreateBillingGroupInput!): BillingGroup
  updateBillingGroup(input: UpdateBillingGroupInput!): BillingGroup
  deleteBillingGroup(billingGroupName: String!, expectedVersion: Int): Boolean
  addThingToBillingGroup(billingGroupName: String, billingGroupArn: String, thingName: String, thingArn: String): Boolean
  removeThingFromBillingGroup(billingGroupName: String, billingGroupArn: String, thingName: String, thingArn: String): Boolean

  # Jobs
  createJob(input: CreateJobInput!): Job
  updateJob(input: UpdateJobInput!): Job
  cancelJob(jobId: String!, reasonCode: String, comment: String, force: Boolean): Job
  deleteJob(jobId: String!, force: Boolean, namespaceId: String): Boolean
  cancelJobExecution(jobId: String!, thingName: String!, force: Boolean, expectedVersion: Int, statusDetails: StatusDetailsInput): Boolean
  deleteJobExecution(jobId: String!, thingName: String!, executionNumber: Int!, force: Boolean, namespaceId: String): Boolean

  # Fleet Indexing
  updateIndexingConfiguration(input: UpdateIndexingConfigurationInput!): Boolean

  # Fleet Metrics
  createFleetMetric(input: CreateFleetMetricInput!): FleetMetric
  updateFleetMetric(input: UpdateFleetMetricInput!): FleetMetric
  deleteFleetMetric(metricName: String!, expectedVersion: Int): Boolean

  # Certificates
  createKeysAndCertificate(setAsActive: Boolean): KeysAndCertificate
  deleteCertificate(certificateId: String!, forceDelete: Boolean): Boolean
  updateCertificate(certificateId: String!, newStatus: CertificateStatus!): Boolean

  # Policies
  createPolicy(input: CreatePolicyInput!): Policy
  deletePolicy(policyName: String!): Boolean
  createPolicyVersion(policyName: String!, policyDocument: String!, setAsDefault: Boolean): PolicyVersion
  deletePolicyVersion(policyName: String!, policyVersionId: String!): Boolean
  setDefaultPolicyVersion(policyName: String!, policyVersionId: String!): Boolean
  attachPolicy(policyName: String!, target: String!): Boolean
  detachPolicy(policyName: String!, target: String!): Boolean
}

