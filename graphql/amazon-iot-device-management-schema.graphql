type PolicyVersion {
  versionId: String
  isDefaultVersion: Boolean
  createDate: String
  document: String
}

type PolicyVersionList {
  policyVersions: [PolicyVersion]
}

type PolicyList {
  policies: [Policy]
  nextMarker: String
}

input CreatePolicyInput {
  policyName: String!
  policyDocument: String!
  tags: [TagInput]
}

# ─── API Key / Token ──────────────────────────────────────────────────────────

type APIKey {
  keyId: String
  keyArn: String
  keyValue: String
  creationDate: String
  status: APIKeyStatus
  description: String
}

type Token {
  tokenValue: String
  expiresAt: String
  tokenType: String
}

enum APIKeyStatus {
  ACTIVE
  INACTIVE
}

# ─── Tags ─────────────────────────────────────────────────────────────────────

type Tag {
  key: String!
  value: String
}

input TagInput {
  key: String!
  value: String
}
